name: Docker image

# Builds the image from docker/Dockerfile and publishes it as
# ghcr.io/henmedia/layerling with the release's version and "latest". When the
# repository has the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, the same
# multi-arch image is copied to Docker Hub as well (docker.io/<user>/layerling),
# where a NAS finds it in its registry search; without them that step is skipped.
# It starts by itself when a GitHub release is published and runs in the
# background - nothing in the release waits for it. amd64 and arm64 are built
# side by side on native runners (no emulation), then joined into one tag.
# "Run workflow" builds it again for an existing release tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.34.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Docker refuses capitals in an image name, and an owner like LudaThomas keeps them in github.repository.
      - name: Lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=layerling
            org.opencontainers.image.description=Easy 3D CAD for 3D printing, in your browser
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ env.TAG }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      # The Dockerfile removes packages the tracer picked up but the server should not need. If a later Next
      # version needs one of them after all, the server breaks here: the digest is not kept, and the publish
      # job neither tags the version nor moves latest.
      - name: Start the image and fetch the start page, the CAD kernel and an API route
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          occt=$(jq -r '.packages["node_modules/occt-wasm"].version' package-lock.json)
          docker run -d --name layerling-smoke -p 3000:3000 "$IMAGE@$DIGEST"
          trap 'docker logs layerling-smoke; docker rm -f layerling-smoke >/dev/null' EXIT
          check() {
            for _ in $(seq 1 30); do
              if result=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "http://127.0.0.1:3000$1" 2>/dev/null); then
                case "$result" in
                  "200 $2"*) echo "$1: $result"; return 0 ;;
                  *) echo "::error::$1 answered $result"; return 1 ;;
                esac
              fi
              sleep 1
            done
            echo "::error::$1 did not answer within 30 s"
            return 1
          }
          check / text/html
          check "/occt/$occt/occt-wasm.wasm" application/wasm
          # The start page is prerendered; a route handler also runs the server's own code.
          check /api/shared-projects application/json

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: Publish ${{ github.event.release.tag_name || inputs.tag }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Collect the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as the version and latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${TAG#v}"
          docker buildx imagetools create \
            -t "$IMAGE:$version" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$version"

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the image to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        run: |
          version="${TAG#v}"
          hub="docker.io/${DOCKERHUB_USERNAME}/layerling"
          docker buildx imagetools create \
            -t "$hub:$version" \
            -t "$hub:latest" \
            "$IMAGE:$version"
          docker buildx imagetools inspect "$hub:$version"
